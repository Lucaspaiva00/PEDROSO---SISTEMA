services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pedroso
      POSTGRES_PASSWORD: pedroso
      POSTGRES_DB: pedroso
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedroso -d pedroso"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://pedroso:pedroso@db:5432/pedroso?schema=public
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
