<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assembleias • Pedroso Consórcios</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <div class="layout">

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <img src="../img/logo.png" alt="Pedroso Consórcios">
            </div>
            <ul>
                <li><a href="dashboard.html"><i class="fa-solid fa-chart-line"></i><span>Dashboard</span></a></li>
                <li><a href="clientes.html"><i class="fa-solid fa-users"></i><span>Clientes</span></a></li>
                <li><a href="planos.html"><i class="fa-solid fa-layer-group"></i><span>Planos</span></a></li>
                <li><a href="contratos.html"><i class="fa-solid fa-file-signature"></i><span>Contratos</span></a></li>
                <li class="active"><a href="assembleias.html"><i class="fa-solid fa-calendar-check"></i><span>Assembleias</span></a></li>
                <li><a href="lances.html"><i class="fa-solid fa-hand-holding-dollar"></i><span>Lances</span></a></li>
                <li><a href="configuracoes.html"><i class="fa-solid fa-gears"></i><span>Configurações</span></a></li>
            </ul>
        </aside>

        <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

        <main class="content">

            <header class="topbar">

                <div class="topbar-start">
                    <button type="button" class="btn-menu" id="btnMenu" aria-expanded="false" aria-controls="sidebar" aria-label="Abrir menu">
                        <i class="fa-solid fa-bars" aria-hidden="true"></i>
                    </button>

                <div>
                    <h1>Assembleias e lances</h1>
                    <p>Abra assembleias por grupo e analise os lances dos contratos.</p>
                </div>

                </div>

                <button type="button" class="btn btn-primary" id="btnNovaAssembleia">Nova assembleia</button>
            </header>

            <section class="card">
                <div class="table-wrapper">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Grupo</th>
                                <th>Título</th>
                                <th>Data</th>
                                <th>Lances</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyAssembleias"></tbody>
                    </table>
                </div>
            </section>

            <section class="card" id="cardAnalise" style="display: none;">
                <h2 id="tituloAnalise">Análise de lances</h2>
                <div id="feedbackAssembleias" class="alert alert-info" role="status" aria-live="polite" hidden tabindex="-1"></div>

                <div id="feedbackLancesAssembleia" class="alert alert-info" role="status" aria-live="polite" hidden tabindex="-1"></div>
                <div class="table-wrapper">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Contrato</th>
                                <th>Cliente</th>
                                <th>Cota</th>
                                <th>Valor (R$)</th>
                                <th>Status</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="tbodyRanking"></tbody>
                    </table>
                </div>
                <div style="margin-top: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap;">
                    <button type="button" class="btn-secondary" id="btnContemplarMaior">Contemplar maior lance</button>
                </div>
            </section>

        </main>
    </div>

    <div class="modal" id="modalAssembleia">
        <div class="modal-content" style="max-width: 560px;">
            <div class="modal-header">
                <h2>Nova assembleia</h2>
                <button type="button" class="btn-close" id="btnFecharModal" aria-label="Fechar">
                    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="formAssembleia">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="assembleiaGrupo">Grupo</label>
                            <input
                                type="text"
                                id="assembleiaGrupo"
                                name="grupo"
                                class="form-control"
                                required
                                placeholder="Mesmo grupo do contrato"
                                autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label for="assembleiaTitulo">Título</label>
                            <input
                                type="text"
                                id="assembleiaTitulo"
                                name="titulo"
                                class="form-control"
                                placeholder="Ex: Assembleia agosto"
                                autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label for="assembleiaData">Data da assembleia</label>
                            <input
                                type="datetime-local"
                                id="assembleiaData"
                                name="dataAssembleia"
                                class="form-control"
                                required>
                        </div>
                        <div class="form-group">
                            <label for="assembleiaAceitaLances" class="form-label-inline">
                                <input type="checkbox" id="assembleiaAceitaLances" name="aceitaLances" checked>
                                Abrir para lances agora
                            </label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" id="btnCancelarAssembleia">
                            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                            Cancelar
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i>
                            Salvar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="../js/api.js"></script>
    <script src="../js/feedback.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/lances-admin.js"></script>
    <script src="../js/assembleias.js"></script>
</body>

</html>
