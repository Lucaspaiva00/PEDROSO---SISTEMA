<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel Administrativo • Pedroso Consórcios</title>

    <link rel="stylesheet" href="../css/app.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <div class="layout">

        <aside class="sidebar" id="sidebar">

            <div class="sidebar-logo">

                <img src="../img/logo.png" alt="Pedroso Consórcios">

            </div>

            <ul>

                <li class="active">

                    <a href="dashboard.html">

                        <i class="fa-solid fa-chart-line"></i>

                        <span>Dashboard</span>

                    </a>

                </li>

                <li>

                    <a href="clientes.html">

                        <i class="fa-solid fa-users"></i>

                        <span>Clientes</span>

                    </a>

                </li>

                <li>

                    <a href="planos.html">

                        <i class="fa-solid fa-layer-group"></i>

                        <span>Planos</span>

                    </a>

                </li>

                <li>

                    <a href="contratos.html">

                        <i class="fa-solid fa-file-signature"></i>

                        <span>Contratos</span>

                    </a>

                </li>

                <li>

                    <a href="assembleias.html">

                        <i class="fa-solid fa-calendar-check"></i>

                        <span>Assembleias</span>

                    </a>

                </li>

                <li>

                    <a href="lances.html">

                        <i class="fa-solid fa-hand-holding-dollar"></i>

                        <span>Lances</span>

                    </a>

                </li>

                <li>

                    <a href="configuracoes.html">

                        <i class="fa-solid fa-gears"></i>

                        <span>Configurações</span>

                    </a>

                </li>

            </ul>

        </aside>

        <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

        <main class="content">

            <header class="topbar">

                <div class="topbar-start">

                    <button type="button" class="btn-menu" id="btnMenu" aria-expanded="false" aria-controls="sidebar" aria-label="Abrir menu">

                        <i class="fa-solid fa-bars" aria-hidden="true"></i>

                    </button>

                    <div>

                        <h2>Dashboard</h2>

                        <span>Bem-vindo ao sistema.</span>

                    </div>

                </div>

                <button type="button" class="btn btn-secondary" id="btnLogout">

                    <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>

                    Sair

                </button>

            </header>

            <section class="page">

                <div id="feedbackDashboard" class="alert alert-info" role="status" aria-live="polite" hidden tabindex="-1"></div>

                <section class="cards">

                    <div class="card">

                        <h3 id="clientes">—</h3>

                        <span>Clientes</span>

                    </div>

                    <div class="card">

                        <h3 id="planos">—</h3>

                        <span>Planos</span>

                    </div>

                    <div class="card">

                        <h3 id="contratos">—</h3>

                        <span>Contratos</span>

                    </div>

                    <div class="card">

                        <h3 id="parcelas">—</h3>

                        <span>Parcelas Pendentes</span>

                    </div>

                </section>

                <section class="dashboard-grid">

                    <div class="box">

                        <h3 class="box-title">Contratos por mês</h3>

                        <div class="chart-wrap">

                        <canvas id="graficoContratos" role="img" aria-labelledby="tituloGraficoContratos"></canvas>

                        </div>

                        <p id="tituloGraficoContratos" class="sr-only">Gráfico de contratos por mês</p>

                        <p id="resumoGraficoContratos" class="sr-only"></p>

                    </div>

                    <div class="box">

                        <h3 class="box-title">Últimos contratos</h3>

                        <div class="table-responsive">

                        <table class="table table-stack" aria-label="Últimos contratos">

                                <thead>

                                    <tr>

                                        <th>Cliente</th>

                                        <th>Plano</th>

                                        <th>Valor</th>

                                        <th>Status</th>

                                    </tr>

                                </thead>

                                <tbody id="ultimosContratos"></tbody>

                            </table>

                        </div>

                    </div>

                </section>

            </section>

        </main>

    </div>

    <script src="../js/api.js"></script>
    <script src="../js/feedback.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/dashboard.js"></script>

</body>

</html>
