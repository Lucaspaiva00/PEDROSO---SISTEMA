<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pedroso Consórcios - Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/login.css">

</head>

<body>

    <div class="container-login">

        <div class="lado-esquerdo">

            <div class="overlay"></div>

        </div>

        <div class="lado-direito">

            <div class="card-login">

                <img src="../img/logo.png" class="logo">

                <h2>Bem-vindo</h2>

                <p>Acesse o painel administrativo.</p>

                <form id="formLogin">

                    <div class="grupo">

                        <label for="email">Email</label>

                        <input type="email" id="email" placeholder="Digite seu e-mail" autocomplete="username" required>

                    </div>

                    <div class="grupo">

                        <label for="senha">Senha</label>

                        <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password" required>

                    </div>

                    <button type="submit">

                        Entrar

                    </button>

                    <div id="mensagem" class="mensagem" role="alert" aria-live="assertive"></div>

                </form>

            </div>

        </div>

    </div>
    <script src="../js/api.js"></script>

    <script src="../js/auth.js"></script>
</body>

</html>
