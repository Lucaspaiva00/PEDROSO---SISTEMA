<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portal do Cliente | Pedroso Consórcios</title>

    <link rel="icon" href="../img/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="stylesheet" href="../css/login.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="container-login">

        <div class="lado-esquerdo">

            <div class="overlay"></div>

        </div>

        <div class="lado-direito">

            <div class="card-login">

                <img src="../img/logo.png" alt="Pedroso Consórcios" class="logo">

                <h2>Portal do Cliente</h2>

                <p>
                    Entre com seu CPF e senha para acessar
                    seu consórcio.
                </p>

                <form id="formLogin">
                    <div class="grupo">

                        <label for="cpf">
                            CPF
                        </label>

                        <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" autocomplete="username">

                    </div>

                    <div class="grupo">

                        <label for="senha">
                            Senha
                        </label>

                        <input type="password" id="senha" placeholder="Digite sua senha"
                            autocomplete="current-password">

                    </div>

                    <button type="submit" id="btnEntrar">

                        <i class="fas fa-right-to-bracket"></i>

                        Entrar

                    </button>

                    <div id="mensagem" class="mensagem">
                    </div>

                </form>

            </div>

        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>

</body>

</html>
