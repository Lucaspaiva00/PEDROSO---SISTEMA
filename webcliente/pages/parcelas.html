<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>

        Minhas Parcelas | Pedroso Consórcios

    </title>

    <link rel="icon" href="../img/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/app.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="app">

        <!-- =========================
             HEADER
        ========================== -->

        <header class="header">

            <div class="header-top">

                <div class="header-text">

                    <span class="header-small">

                        Minhas Parcelas

                    </span>

                    <h1>

                        Pedroso Consórcios

                    </h1>

                </div>

                <button class="btn-profile" id="btnVoltar">

                    <i class="fa-solid fa-arrow-left"></i>

                </button>

            </div>

        </header>

        <!-- =========================
             CONTEÚDO
        ========================== -->

        <main class="content">

            <!-- =========================
         LISTA DE CONSÓRCIOS
    ========================== -->

            <section id="listaContratos" class="card">

                <span class="card-label">

                    Meus Consórcios

                </span>

                <div id="contratosContainer">

                    <div class="empty-state">

                        Carregando consórcios...

                    </div>

                </div>

            </section>

            <!-- =========================
         ÁREA DAS PARCELAS
    ========================== -->

            <div id="areaParcelas" style="display:none;">

                <!-- =========================
             PRÓXIMA PARCELA
        ========================== -->

                <section class="card card-primary">

                    <span class="card-label">

                        Próxima Parcela

                    </span>

                    <h2 id="valorProximaParcela" class="card-value">

                        R$ 0,00

                    </h2>

                    <p id="vencimentoProximaParcela" class="card-description">

                        Carregando...

                    </p>

                    <div id="statusProximaParcela" class="badge badge-warning">

                        PENDENTE

                    </div>

                </section>

                <!-- =========================
             AÇÕES
        ========================== -->

                <section class="card">

                    <span class="card-label">

                        Ações

                    </span>

                    <div class="quick-actions">

                        <button class="quick-action" id="btnBoleto">

                            <div class="quick-action-icon">

                                <i class="fa-solid fa-file-invoice-dollar"></i>

                            </div>

                            <span>Boleto</span>

                        </button>

                        <button class="quick-action" id="btnPix">

                            <div class="quick-action-icon">

                                <i class="fa-solid fa-qrcode"></i>

                            </div>

                            <span>PIX</span>

                        </button>

                        <button class="quick-action" id="btnComprovante">

                            <div class="quick-action-icon">

                                <i class="fa-solid fa-receipt"></i>

                            </div>

                            <span>Comprovante</span>

                        </button>

                    </div>

                </section>

                <!-- =========================
             HISTÓRICO
        ========================== -->

                <section class="card">

                    <span class="card-label">

                        Histórico de Parcelas

                    </span>

                    <div id="listaParcelas" class="parcel-list">

                        <div class="empty-state">

                            Carregando parcelas...

                        </div>

                    </div>

                </section>

            </div>

            <!-- continua exatamente igual -->

            <div class="modal" id="modalParcela">

                <div class="modal-content">

                    <div class="modal-header">

                        <h3>

                            Detalhes da Parcela

                        </h3>

                        <button id="btnFecharModal">

                            <i class="fa-solid fa-xmark"></i>

                        </button>

                    </div>
                    <div class="modal-body">

                        <div class="resume-item">
                            <span>Parcela</span>
                            <strong id="modalNumero">-</strong>
                        </div>

                        <div class="resume-item">
                            <span>Valor</span>
                            <strong id="modalValor">-</strong>
                        </div>

                        <div class="resume-item">
                            <span>Vencimento</span>
                            <strong id="modalVencimento">-</strong>
                        </div>

                        <div class="resume-item">
                            <span>Status</span>
                            <strong id="modalStatus">-</strong>
                        </div>

                    </div>

                    <div class="modal-actions">

                        <button id="btnModalBoleto" class="btn btn-primary">
                            <i class="fa-solid fa-file-invoice-dollar"></i>
                            Abrir boleto
                        </button>

                        <button id="btnModalPix" class="btn btn-secondary">
                            <i class="fa-solid fa-qrcode"></i>
                            Mostrar PIX
                        </button>

                        <button id="btnModalCopiarPix" class="btn btn-secondary">
                            <i class="fa-solid fa-copy"></i>
                            Copiar PIX
                        </button>

                        <button id="btnModalComprovante" class="btn btn-success">
                            <i class="fa-solid fa-receipt"></i>
                            Comprovante
                        </button>

                    </div>

                </div>

            </div>


        </main>
    </div>


    <nav class="bottom-nav">

        <a href="dashboard.html" class="bottom-item">

            <i class="fa-solid fa-house"></i>

            <span>

                Início

            </span>

        </a>

        <a href="contrato.html" class="bottom-item">

            <i class="fa-solid fa-file-contract"></i>

            <span>

                Contrato

            </span>

        </a>

        <a href="parcelas.html" class="bottom-item active">

            <i class="fa-solid fa-credit-card"></i>

            <span>

                Parcelas

            </span>

        </a>

        <a href="perfil.html" class="bottom-item">

            <i class="fa-solid fa-user"></i>

            <span>

                Perfil

            </span>

        </a>

    </nav>

    </div>

    <script src="../js/api.js"></script>
    <script src="../js/parcelas.js"></script>

</body>

</html>
